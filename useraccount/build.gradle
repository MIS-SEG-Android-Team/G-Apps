plugins {
    id 'com.android.library'
}

android {
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdkVersion 35

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'org.rmj.guanzongroup.useraccount'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation 'androidx.navigation:navigation-runtime:2.8.9'
    implementation 'androidx.camera:camera-core:1.4.1'

    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    implementation 'androidx.test:core:1.6.1'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.github.mjn1369:fieldsetview:1.0.0'

    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.mlkit:face-detection:16.1.7'

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    //implementation 'com.kofigyan.stateprogressbar:stateprogressbar:1.0.0'

    implementation project(':g3appdriver')

    //Document scanner
    implementation project(':documentScanner')

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.sqlite:sqlite:2.4.0'
    implementation 'androidx.room:room-testing:2.6.1'

    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    androidTestImplementation 'org.testng:testng:7.4.0'
    androidTestImplementation "android.arch.core:core-testing:1.1.1"

    implementation 'com.google.zxing:core:3.5.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'me.dm7.barcodescanner:zxing:1.9.13'
    implementation 'com.karumi:dexter:6.2.3'
}