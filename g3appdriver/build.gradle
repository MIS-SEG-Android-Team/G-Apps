apply plugin: 'com.android.library'

android {
    compileSdk 34

    defaultConfig {
        multiDexEnabled true
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'org.rmj.g3appdriver'
}

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.mcxiaoke.volley:library-aar:1.0.1'

    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.loopj.android:android-async-http:1.4.11'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.sqlite:sqlite:2.4.0'

    implementation 'com.google.android.gms:play-services-base:18.6.0'
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.google.android.play:asset-delivery-ktx:2.3.0'
    implementation 'com.google.android.play:feature-delivery:2.1.0'
    implementation 'com.google.android.play:feature-delivery-ktx:2.1.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:review-ktx:2.0.2'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    implementation 'androidx.test:core:1.6.1'
    implementation 'androidx.test.ext:junit:1.2.1'

    implementation 'com.google.firebase:firebase-messaging:24.1.1'

    implementation 'androidx.navigation:navigation-fragment:2.8.9'
    implementation 'androidx.navigation:navigation-ui:2.8.9'

    implementation 'com.squareup.picasso:picasso:2.71828'

    // Image Slider Dependencies
    implementation 'com.github.smarteist:autoimageslider:1.4.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'

    //implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.google.zxing:core:3.5.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    //loading implementation
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'

    //noinspection PlaySdkIndexNonCompliant
    implementation 'com.facebook.android:facebook-common:13.2.0'
    implementation 'com.facebook.android:facebook-login:18.0.2'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.facebook.android:facebook-android-sdk:18.0.2'

    implementation files('libs/json-simple-1.1.1.jar')
    implementation files('libs/commons-codec-1.11.jar')
    implementation files('libs/appdriver.jar')
    implementation files('libs/gocas.jar')
    implementation files('libs/appdriver-mob.jar')

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
}
